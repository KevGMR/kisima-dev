# netlify.toml
# ===========================================================================
# Kisima Cargo — Netlify configuration
#
# Covers:
#   1. Astro build settings
#   2. Staging noindex (per-context env vars)
#   3. 301 redirects from legacy dev URLs
#   4. Security and caching headers
#   5. Real 404 handling (via dist/404.html)
#
# Change Brief refs: Section 2 (staging indexation), Section 6 (technical SEO),
#                    Section 13 (pre-launch checklist).
#
# NOTE: This file configures headers and redirects. It does not make the site
# crawlable on its own — Astro's static output does that. Staging noindex is
# driven by VITE_SITE_ENV per deploy context (see docs/stack-decision.md).
# ===========================================================================

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# ---------------------------------------------------------------------------
# Contexts
#
# `main`           -> production  (indexable)
# everything else  -> staging     (noindex via VITE_SITE_ENV + _headers)
# ---------------------------------------------------------------------------
[context.production]
  branch = "main"

[context.deploy-preview]
  # Set VITE_SITE_ENV=staging in Netlify UI for this context.

[context.branch-deploy]
  # Set VITE_SITE_ENV=staging in Netlify UI for this context.

# ---------------------------------------------------------------------------
# Headers
#
# Per-context header variation is handled by dist/_headers written at build
# time (scripts/set-headers.mjs). The [[headers]] blocks below apply to
# every context.
# ---------------------------------------------------------------------------

# ---- Security (all contexts) ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ---- Cache: hashed assets (Astro outputs to /_astro/) ----
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---- Cache: images and other static assets ----
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ---- Cache: HTML always revalidates so metadata changes ship immediately ----
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- Cache: robots.txt short cache ----
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ---- Cache: sitemap (Astro emits sitemap-index.xml + sitemap-0.xml) ----
[[headers]]
  for = "/sitemap-index.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap-*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ---------------------------------------------------------------------------
# Redirects — 301s from legacy dev-app URLs.
#
# Mirrors LEGACY_REDIRECTS in src/config/routes.ts.
#
# NOTE: Redirects from the pre-existing kisimacargo.com site are NOT yet
# included. They need the current live URL inventory (see
# docs/implementation-checklist.md).
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/calculator"
  to = "/tools/shipping-calculator"
  status = 301
  force = true

[[redirects]]
  from = "/tracking-shipment"
  to = "/tools/track-shipment"
  status = 301
  force = true

[[redirects]]
  from = "/buying-shipping"
  to = "/shop-and-ship"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/help"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# 404 handling
#
# Astro emits dist/404.html. Netlify serves it automatically with a real 404
# HTTP status for any unmatched path.
#
# The previous SPA fallback (/* -> /index.html, status 200) has been
# REMOVED because it caused soft-404 responses, which the Change Brief
# (Sections 6, 13) forbids.
# ---------------------------------------------------------------------------
